<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dati di fatturazione — Virtual Arena 43</title><style>:root{--y:#ffd400;
--p:#141414}*{box-sizing:border-box}body{margin:0;
background:#070707;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:700px;
margin:auto;
padding:24px 16px 60px}.logo{display:block;
width:min(100%,520px);
margin:0 auto 8px}.sub{text-align:center;
color:#aaa;
margin-bottom:24px}.card{background:var(--p);
border:1px solid #333;
border-radius:20px;
padding:18px;
margin:14px 0}h1{font-size:23px;
margin:0 0 8px}h2{font-size:16px;
margin:0 0 12px}input{width:100%;
padding:13px;
margin:6px 0;
border-radius:12px;
border:1px solid #444;
background:#0b0b0b;
color:#fff;
font:inherit}.submit{width:100%;
padding:17px;
border:0;
border-radius:15px;
background:var(--y);
font-weight:900;
font-size:17px;
cursor:pointer}.back{display:block;
text-align:center;
color:#aaa;
margin-top:14px;
text-decoration:none}.small{font-size:13px;
color:#aaa}.summary{line-height:1.7}.msg{margin-top:12px;
color:#ff8d8d}</style></head><body><main class="wrap"><img class="logo" src="/logo.svg" alt="Virtual Arena 43"><div class="sub">Pagamento online</div><div class="card"><h1>Dati per la fattura</h1><div class="small">Inserisci i dati dell'intestatario prima di procedere al pagamento.</div></div>
<div class="card"><h2>Intestatario</h2><input id="firstName" autocomplete="given-name" placeholder="Nome"><input id="lastName" autocomplete="family-name" placeholder="Cognome"><input id="address" autocomplete="street-address" placeholder="Indirizzo di residenza">
<input id="taxCode" autocomplete="off" maxlength="16" placeholder="Codice fiscale"><p class="small">I dati sono utilizzati per pagamento e fatturazione come descritto nell’<a href="/privacy.html" target="_blank" style="color:#ffd400">informativa privacy</a>.</p></div>
<div class="card"><h2>Riepilogo prenotazione</h2><div id="summary" class="summary small"></div></div><button id="pay" class="submit">CONTINUA AL PAGAMENTO</button><div id="msg" class="msg"></div><a class="back" href="/">← Torna alla prenotazione</a></main><script>const raw=sessionStorage.getItem('va43OnlineBooking');
let booking;
try{booking=JSON.parse(raw||'null')}catch{}if(!booking){location.href='/'}const D=document;
const base=booking.players===1?25:booking.players*20;
const total=booking.discountCode?base*.9:base;
D.querySelector('#summary').innerHTML=`${booking.date} · ${booking.time}<br>${booking.players} giocator${booking.players===1?'e':'i'}<br>Totale: <b>€ ${total.toFixed(total%1?2:0).replace('.',',')}</b>${booking.discountCode?` · ${booking.discountCode} -10%`:''}`;
D.querySelector('#pay').onclick=async()=>{const firstName=D.querySelector('#firstName').value.trim(),lastName=D.querySelector('#lastName').value.trim(),address=D.querySelector('#address').value.trim(),taxCode=D.querySelector('#taxCode').value.trim().toUpperCase(),msg=D.querySelector('#msg');
msg.textContent='';
if(!firstName||!lastName||!address||!taxCode)return msg.textContent='Compila tutti i dati di fatturazione.';
if(!/^[A-Z0-9]{16}$/.test(taxCode))return msg.textContent='Controlla il codice fiscale: deve avere 16 caratteri.';
const body={...booking,billing:{firstName,lastName,address,taxCode}};
const r=await fetch('/api/bookings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),j=await r.json();
if(!r.ok){msg.textContent=j.error||'Errore';
return}sessionStorage.removeItem('va43OnlineBooking');
if(j.checkoutUrl){location.href=j.checkoutUrl;
return}msg.textContent='Pagamento online non disponibile.'};
</script></body></html>
