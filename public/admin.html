<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Virtual Arena 43</title><style>body{background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:18px}main{max-width:1000px;margin:auto}h1{color:#ffd400}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #444;background:#151515;color:#fff}button{background:#ffd400;color:#000;font-weight:800}.booking{background:#151515;border:1px solid #333;border-radius:15px;padding:14px;margin:10px 0}.meta{color:#aaa;font-size:13px}.paid{color:#64e572}.pending{color:#ffd400}.cancelled{opacity:.5}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}.players-edit{display:flex;gap:8px;align-items:center}.players-edit select{min-width:72px}.save{background:#fff;color:#000}.cancel-btn{background:#ff5252;color:#fff;border-color:#ff5252}.status-msg{font-size:12px;color:#64e572;margin-top:6px}.status-msg.err{color:#ff7777}@media(max-width:560px){.actions,.players-edit{width:100%}.players-edit select,.players-edit button{flex:1}}</style></head><body><main><h1>Virtual Arena 43 · Admin</h1><p><input id="pw" type="password" placeholder="Password admin"> <button onclick="load()">ENTRA</button></p><div id="list"></div></main><script>const D=document;async function load(){const pw=D.querySelector('#pw').value,r=await fetch('/api/admin/bookings',{headers:{'x-admin-password':pw}}),j=await r.json();if(!r.ok)return alert(j.error||'Errore');const l=D.querySelector('#list');l.innerHTML='';if(!j.length)l.innerHTML='<p>Nessuna prenotazione.</p>';j.forEach(b=>{const inactive=['cancelled','expired'].includes(b.status),e=D.createElement('div');e.className='booking '+(inactive?'cancelled':'');const opts=[1,2,3,4].map(n=>`<option value="${n}" ${n===b.players?'selected':''}>${n}</option>`).join('');e.innerHTML=`<b>${b.booking_date} · ${b.booking_time}</b> — ${b.players} giocatori<br>${b.name} · <a href="tel:${b.phone}">${b.phone}</a><br><span class="meta">${b.email} · ${b.booking_code}</span><br><b class="${b.payment_status==='paid'?'paid':'pending'}">${b.payment_status==='paid'?'PAGATO ONLINE':b.payment_method==='arena'?'DA PAGARE IN ARENA':'PAGAMENTO IN ATTESA'}</b> · €${(b.total_cents/100).toFixed(0)} · ${b.status}<br>${b.notes?'<span class="meta">Note: '+b.notes+'</span><br>':''}${!inactive?`<div class="actions"><div class="players-edit"><span class="meta">Giocatori</span><select id="players-${b.id}">${opts}</select><button class="save" onclick="changePlayers(${b.id})">MODIFICA</button></div><button class="cancel-btn" onclick="cancelBooking(${b.id})">ANNULLA</button></div><div id="status-${b.id}" class="status-msg"></div>`:''}`;l.appendChild(e)})}async function changePlayers(id){const pw=D.querySelector('#pw').value,players=Number(D.querySelector('#players-'+id).value),s=D.querySelector('#status-'+id);s.className='status-msg';s.textContent='Salvataggio…';const r=await fetch('/api/admin/bookings/'+id+'/players',{method:'PATCH',headers:{'content-type':'application/json','x-admin-password':pw},body:JSON.stringify({players})}),j=await r.json();if(!r.ok){s.className='status-msg err';s.textContent=j.error||'Errore';return}s.textContent='Aggiornato. I posti disponibili sono stati ricalcolati.';setTimeout(load,500)}async function cancelBooking(id){if(!confirm('Annullare questa prenotazione? I posti torneranno disponibili.'))return;const r=await fetch('/api/admin/bookings/'+id+'/cancel',{method:'PATCH',headers:{'x-admin-password':D.querySelector('#pw').value}});if(!r.ok)return alert('Errore durante annullamento');load()}</script></body></html>
