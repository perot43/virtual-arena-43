<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Virtual Arena 43</title><style>body{background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:18px}main{max-width:1000px;margin:auto}h1{color:#ffd400}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #444;background:#151515;color:#fff}button{background:#ffd400;color:#000;font-weight:800}.booking{background:#151515;border:1px solid #333;border-radius:15px;padding:14px;margin:10px 0}.meta{color:#aaa;font-size:13px}.paid{color:#64e572}.pending{color:#ffd400}.cancelled{opacity:.5}</style></head><body><main><h1>Virtual Arena 43 · Admin</h1><p><input id="pw" type="password" placeholder="Password admin"> <button onclick="load()">ENTRA</button></p><div id="list"></div></main><script>const D=document;async function load(){const pw=D.querySelector('#pw').value,r=await fetch('/api/admin/bookings',{headers:{'x-admin-password':pw}}),j=await r.json();if(!r.ok)return alert(j.error||'Errore');const l=D.querySelector('#list');l.innerHTML='';if(!j.length)l.innerHTML='<p>Nessuna prenotazione.</p>';j.forEach(b=>{const e=D.createElement('div');e.className='booking '+(b.status==='cancelled'?'cancelled':'');e.innerHTML=`<b>${b.booking_date} · ${b.booking_time}</b> — ${b.players} giocatori<br>${b.name} · <a href="tel:${b.phone}">${b.phone}</a><br><span class="meta">${b.email} · ${b.booking_code}</span><br><b class="${b.payment_status==='paid'?'paid':'pending'}">${b.payment_status==='paid'?'PAGATO ONLINE':b.payment_method==='arena'?'DA PAGARE IN ARENA':'PAGAMENTO IN ATTESA'}</b> · €${(b.total_cents/100).toFixed(0)} · ${b.status}<br>${b.notes?'<span class="meta">Note: '+b.notes+'</span><br>':''}<button onclick="cancel(${b.id})">ANNULLA</button>`;l.appendChild(e)})}async function cancel(id){if(!confirm('Annullare questa prenotazione?'))return;await fetch('/api/admin/bookings/'+id+'/cancel',{method:'PATCH',headers:{'x-admin-password':D.querySelector('#pw').value}});load()}</script></body></html>
